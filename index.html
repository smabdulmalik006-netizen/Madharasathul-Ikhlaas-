<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADHARASATHUL IKHLAAS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#1B1F2A;color:#fff;padding-bottom:90px;overflow-x:hidden}
.top-img{width:100%;height:auto;object-fit:contain;display:block;background:#1B1F2A}
.gold-line{height:2px;background:linear-gradient(90deg,transparent,#C9A227,transparent)}
.search{margin:14px;background:#262B38;border:1px solid rgba(201,162,39,.5);border-radius:25px;padding:13px 15px;display:flex;gap:8px}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px}
.search input::placeholder{color:#8A93A6}
.live{margin:0 14px 12px;background:linear-gradient(135deg,#D4AF37,#9A7B1A);border-radius:18px;padding:16px;text-align:center;cursor:pointer}
.live b{font-size:16px;color:#fff}
.live p{font-size:13px;color:#fff;opacity:.9;margin:5px 0 10px}
.live div:last-child{background:#1B1F2A;color:#C9A227;padding:13px;border-radius:12px;font-weight:700}
.adm{margin:0 14px 16px;border:1.5px solid #C9A227;color:#C9A227;text-align:center;padding:15px;border-radius:14px;font-weight:700;cursor:pointer}
.sec{padding:0 14px 10px;color:#C9A227;font-family:'Cinzel',serif;font-size:14px;letter-spacing:1px}
.card{background:#242936;border:1px solid rgba(201,162,39,.3);border-radius:18px;display:flex;gap:14px;padding:13px;margin:0 14px 12px;align-items:center;cursor:pointer}
.quran-card{background:linear-gradient(135deg,#0F3D26,#1E5A3A);border:1.5px solid #C9A227}
.cover{width:66px;height:90px;border-radius:10px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;line-height:1.2}
.cover small{font-size:9px;font-weight:400;opacity:.9;margin-top:4px}
.c1{background:linear-gradient(135deg,#1E5A3A,#0F3D26);color:#FFD700;border:1px solid #C9A227}
.c2{background:linear-gradient(135deg,#0F3D5E,#0A2A42);color:#fff;border:1px solid #C9A227}
.c3{background:linear-gradient(135deg,#5A3A0F,#3A2408);color:#FFD700;border:1px solid #C9A227}
.c4{background:linear-gradient(135deg,#4A1A1A,#2A0F0F);color:#FFD700;border:1px solid #C9A227}
.card h3{font-size:16px}
.card p{font-size:13px;color:#9AA3B2;margin:2px 0}
.card span{font-size:11px;color:#C9A227;font-weight:600}
.box{margin:12px;background:#242936;border:1px solid rgba(201,162,39,.4);border-radius:20px;padding:20px;display:none}
.box h2{color:#C9A227;text-align:center;font-family:'Cinzel',serif}
.box input,.box select{width:100%;padding:13px;margin:8px 0;border:1px solid rgba(201,162,39,.4);border-radius:12px;background:#1B1F2A;color:#fff;outline:none}
.box button{width:100%;background:linear-gradient(135deg,#C9A227,#8A6D1A);color:#fff;padding:15px;border:none;border-radius:12px;font-weight:700;font-size:16px}
.call-btn{display:block;margin-top:12px;background:#1a73e8;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:#141821;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid rgba(201,162,39,.4);z-index:99}
.nav div{text-align:center;font-size:12px;color:#9AA3B2;cursor:pointer}
.nav .active{color:#C9A227;font-weight:700}
.surah-item{background:#242936;border:1px solid rgba(201,162,39,.25);border-radius:14px;padding:13px;margin:0 14px 8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.surah-item b{font-size:15px}
.surah-item span{color:#C9A227;font-size:18px}
.surah-item small{color:#9AA3B2;font-size:12px}
#reader{position:fixed;top:0;left:0;right:0;bottom:0;background:#1B1F2A;display:none;flex-direction:column;z-index:999}
#readerHeader{background:#C9A227;color:#1B1F2A;padding:13px;display:flex;justify-content:space-between;font-weight:700}
#readerHeader button{background:#1B1F2A;color:#C9A227;border:none;padding:8px 14px;border-radius:8px;font-weight:700}
#readerContent{flex:1;overflow-y:auto;padding:14px}
#readerContent canvas{width:100%;max-width:800px;background:#fff;margin:0 auto 10px;border-radius:6px;display:block}
.ayah{background:#242936;border:1px solid rgba(201,162,39,.2);border-radius:14px;padding:14px;margin-bottom:10px}
.ayah .ar{font-size:26px;text-align:right;line-height:2.1;direction:rtl}
.ayah .num{color:#C9A227;font-size:12px;font-weight:700}
.tamil{font-size:15px;color:#E8E8E8;line-height:1.7;margin-top:12px;border-top:1px dashed rgba(201,162,39,.3);padding-top:10px}
.tamil b{color:#C9A227;font-size:11px;display:block;margin-bottom:4px}
.tajweed-box{background:#242936;border:1px solid rgba(201,162,39,.3);border-radius:12px;padding:10px;margin-bottom:12px;display:flex;justify-content:space-around;font-size:11px;text-align:center}
.tajweed-box b{display:block;font-size:12px}
</style>
</head>
<body>
<img src="logo.jpg" class="top-img">
<div class="gold-line"></div>
<div id="homeSection">
<div class="search">🔍 <input id="searchInput" onkeyup="searchBooks()" placeholder="
